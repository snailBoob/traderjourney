name: Build and publish TraderJourney

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: snailboob/traderjourney

jobs:
  quality:
    if: github.repository == 'snailBoob/traderjourney'
    name: Verify source before publishing
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build and publish Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/snailboob/traderjourney:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/snailBoob/traderjourney
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test both architectures
        timeout-minutes: 10
        env:
          IMAGE: ghcr.io/snailboob/traderjourney@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'docker logs journal-smoke 2>/dev/null || true; docker rm -fv journal-smoke 2>/dev/null || true' EXIT
          for arch in amd64 arm64; do
            docker run -d --name journal-smoke --platform "linux/$arch" -p 127.0.0.1:3000:3000 "$IMAGE"
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://localhost:3000/api/accounts > accounts.json; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
            node -e 'const r = require("./accounts.json"); if (!Array.isArray(r.accounts) || r.accounts.length !== 0) process.exit(1)'
            docker exec journal-smoke node -e "if (process.arch !== '$arch'.replace('amd64', 'x64')) process.exit(1)"
            curl --fail --silent http://localhost:3000/login > login.html
            grep -q TraderJourney login.html
            echo "linux/$arch: startup, SQLite API and login passed"
            docker rm -fv journal-smoke
          done

      - name: Publish verified release tags
        env:
          IMAGE: ghcr.io/snailboob/traderjourney
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
